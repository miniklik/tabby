:root{

  --display:'Fredoka','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{min-height:100%;background:#0c1030}
body{margin:0;min-height:100vh;color:var(--ink);font-family:var(--body);
  background:radial-gradient(ellipse 120% 60% at 20% 110%,rgba(240,163,94,.28),transparent 60%),linear-gradient(#0a0e2a 0%,#141a44 55%,#2a2150 100%) fixed;
  padding:max(28px,env(safe-area-inset-top)) clamp(18px,5vw,64px) max(48px,env(safe-area-inset-bottom))}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1120px;margin:0 auto}
.g-head{display:flex;align-items:center;gap:20px;flex-wrap:wrap;margin-bottom:10px}
.back{display:inline-block;text-decoration:none;font-size:15px;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:9px 18px}
.back:hover{border-color:var(--line-hi)}
h1{margin:0;font-family:var(--display);font-weight:500;font-size:clamp(32px,4.4vw,46px);color:var(--moon)}
.lead{margin:0 0 30px;color:var(--muted);font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:24px}
.tile{display:block;width:100%;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;
  background:rgba(22,27,69,.9);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .2s}
.tile:hover{border-color:var(--line-hi)}
.tile:focus-visible,.back:focus-visible{outline:3px solid var(--glow);outline-offset:3px}
.shot{position:relative;aspect-ratio:16/10;background:#232a5c}
.shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.shot .wait{position:absolute;inset:0;display:grid;place-items:center;color:var(--muted);font-size:14px}
.txt{padding:16px 18px 20px}
.tile h3{margin:0 0 6px;font-family:var(--display);font-weight:500;font-size:21px}
.tile p{margin:0 0 12px;font-size:14.5px;line-height:1.5;color:var(--muted)}
.tile small{font-size:13px;color:var(--glow)}
@media (prefers-reduced-motion:reduce){.tile{transition:none}}
</style>
</head>

<script>
(function(){
var EDITOR='tabby-editor.html';
var SCENES=window.TABBY_SCENES||[];

// --- gwiazdy w tle (lekkie, 2D) ---
(function(){
  var c=document.getElementById('stars'),x=c.getContext('2d'),st=[];
  var still=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function size(){c.width=innerWidth*(devicePixelRatio||1);c.height=innerHeight*(devicePixelRatio||1);
    st=[];for(var i=0;i<Math.round(innerWidth*innerHeight/2600);i++)st.push({x:Math.random(),y:Math.pow(Math.random(),1.4)*0.8,r:Math.random()<0.07?1.6:0.5+Math.random()*0.8,p:Math.random()*6.28,s:1+Math.random()*2});}
  function draw(t){x.clearRect(0,0,c.width,c.height);var d=devicePixelRatio||1;
    st.forEach(function(s){var a=0.45+0.4*Math.sin(t/1000*s.s+s.p);x.globalAlpha=still?0.7:a;x.fillStyle='#fff6e6';x.beginPath();x.arc(s.x*c.width,s.y*c.height,s.r*d,0,6.283);x.fill();});
    if(!still)requestAnimationFrame(draw);}
  addEventListener('resize',function(){size();if(still)draw(0);});size();requestAnimationFrame(draw);
})();

function openEditor(data){window.name='TABBY_SCENE:'+JSON.stringify(data);location.href=EDITOR;}
function plural(n){var d=n%10,h=n%100;if(n===1)return'obiekt';if(d>=2&&d<=4&&(h<12||h>14))return'obiekty';return'obiektów';}

// ================= BUDOWANIE OBIEKTÓW Z PARTS =================
function buildParts(parts,opt){
  var g=new THREE.Group();
  parts.forEach(function(p){
    var s=p.size||[1,1,1],geo,mat;
    if(p.shape==='pointlight'){
      var m=new THREE.Mesh(new THREE.SphereGeometry(s[0]||0.1,8,6),new THREE.MeshBasicMaterial({color:p.color}));
      if(p.position)m.position.fromArray(p.position);g.add(m);return;
    }
    switch(p.shape){
      case'box':geo=new THREE.BoxGeometry(s[0],s[1],s[2]);break;
      case'sphere':geo=new THREE.SphereGeometry(s[0],s[1]||8,s[2]||6);break;
      case'cylinder':geo=new THREE.CylinderGeometry(s[0],s[1],s[2],s[3]||8);break;
      case'cone':geo=new THREE.ConeGeometry(s[0],s[1],s[2]||8);break;
      case'plane':geo=new THREE.PlaneGeometry(s[0],s[1]);break;
      default:geo=new THREE.BoxGeometry(1,1,1);
    }
    mat=new THREE.MeshStandardMaterial({color:p.color,roughness:0.75,flatShading:!!(opt&&opt.flat)});
    var m=new THREE.Mesh(geo,mat);
    if(p.position)m.position.fromArray(p.position);
    if(p.rotation)m.rotation.set(p.rotation[0],p.rotation[1],p.rotation[2]);
    if(opt&&opt.shadow){m.castShadow=true;m.receiveShadow=true;}
    g.add(m);
  });
  return g;
}
function disposeTree(o){o.traverse(function(c){if(c.geometry)c.geometry.dispose();if(c.material){if(c.material.map)c.material.map.dispose();c.material.dispose();}});}

// ================= MINIATURKI SCEN =================
var thumbR=null;
function makeThumb(sc){
  try{
    if(!thumbR){thumbR=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});thumbR.setSize(640,400);thumbR.shadowMap.enabled=true;}
    var s=new THREE.Scene();s.background=new THREE.Color(0x8fb4d8);s.fog=new THREE.Fog(0x8fb4d8,60,160);
    s.add(new THREE.HemisphereLight(0xcfe4ff,0x55663f,0.75));
    var sun=new THREE.DirectionalLight(0xfff1dc,0.9);sun.position.set(25,40,18);sun.castShadow=true;
    sun.shadow.mapSize.set(1024,1024);var c=sun.shadow.camera;c.left=-60;c.right=60;c.top=60;c.bottom=-60;c.far=150;s.add(sun);
    var ground=new THREE.Mesh(new THREE.PlaneGeometry(240,240),new THREE.MeshStandardMaterial({color:0x5d7048,roughness:0.95}));
    ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;s.add(ground);
    var groups=sc.data.objects.map(function(o){return buildParts(o.parts,{shadow:true});});
    sc.data.placed.forEach(function(pd){var g=groups[pd.oi].clone();g.position.set(pd.x,0,pd.z);g.rotation.y=pd.rotY||0;s.add(g);});
    var cam=new THREE.PerspectiveCamera(42,1.6,0.5,400);cam.position.fromArray(sc.cam||[30,24,30]);cam.lookAt(0,0,0);
    thumbR.render(s,cam);
    var url=thumbR.domElement.toDataURL('image/jpeg',0.86);
    groups.forEach(disposeTree);ground.geometry.dispose();ground.material.dispose();
    return url;
  }catch(e){console.warn('Tabby: podgląd',e);return null;}
}


var grid=document.getElementById('grid');
SCENES.forEach(function(sc,i){
  var b=document.createElement('button');b.className='tile';
  var n=(sc.data.placed||[]).length;
  b.innerHTML='<div class="shot"><div class="wait">Rysuję podgląd…</div></div><div class="txt"><h3></h3><p></p><small>'+n+' '+plural(n)+'</small></div>';
  b.querySelector('h3').textContent=sc.title||'Scena';b.querySelector('p').textContent=sc.desc||'';
  b.onclick=function(){openEditor(sc.data);};
  grid.appendChild(b);
  setTimeout(function(){
    var url=window.THREE?makeThumb(sc):null,shot=b.querySelector('.shot');
    if(url){var img=new Image();img.alt='Podgląd sceny '+(sc.title||'');img.src=url;shot.innerHTML='';shot.appendChild(img);}
    else shot.querySelector('.wait').textContent='Podgląd niedostępny';
  },40+i*80);
});
})();
</script>
