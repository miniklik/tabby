<!DOCTYPE html>
<html lang="pl">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tabby Store</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f1333;--card:#171c47;--card-hover:#1e2459;--border:rgba(255,243,212,.14);
  --text:#e6e0f0;--text-dim:#a59fbf;--text-bright:#fff3d4;
  --accent:#f0a35e;--green:#3fb950;--orange:#d29922;--purple:#bc8cff;--pink:#f778ba;--red:#f85149;
  --radius:10px;
}
html,body{min-height:100vh;background:var(--bg);color:var(--text);font-family:'Nunito','Segoe UI',system-ui,sans-serif}
body{background:radial-gradient(ellipse 120% 50% at 15% 105%,rgba(240,163,94,.18),transparent 60%),linear-gradient(#0a0e2a,#141a44 60%,#231d4a) fixed}

/* HEADER */
.header{padding:28px 24px 0;max-width:1320px;margin:0 auto}
.header h1{font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;font-size:40px;font-weight:600;color:var(--text-bright);letter-spacing:-0.5px}
.back{display:inline-block;margin-bottom:16px;text-decoration:none;font-size:14px;color:var(--text);border:1px solid var(--border);border-radius:999px;padding:8px 16px}
.back:hover{border-color:rgba(255,243,212,.5)}
.back:focus-visible,.pill:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.header h1 span{color:var(--accent)}
.header p{color:var(--text-dim);font-size:14px;margin-top:6px;line-height:1.5;max-width:560px}

/* TOOLBAR */
.toolbar{max-width:1320px;margin:20px auto 0;padding:0 24px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search-box{flex:1;min-width:200px;position:relative}
.search-box input{width:100%;background:var(--card);border:1px solid var(--border);color:var(--text-bright);padding:10px 14px 10px 38px;border-radius:var(--radius);font-size:13px;font-family:inherit;outline:none;transition:border-color .2s}
.search-box input:focus{border-color:var(--accent)}
.search-box svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--text-dim)}
.filter-pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:7px 14px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text-dim);font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s;white-space:nowrap}
.pill:hover{border-color:var(--text-dim);color:var(--text)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#000}
.pill[data-cat="natura"].active{background:#3fb950;border-color:#3fb950}
.pill[data-cat="budynek"].active{background:#d29922;border-color:#d29922}
.pill[data-cat="dekoracja"].active{background:#bc8cff;border-color:#bc8cff}
.pill[data-cat="interaktywny"].active{background:#f778ba;border-color:#f778ba}
.pill[data-cat="pojazd"].active{background:#f85149;border-color:#f85149}
.pill[data-cat="ruiny"].active{background:#8fa8c8;border-color:#8fa8c8}
.pill[data-cat="militaria"].active{background:#7d8a3c;border-color:#7d8a3c}
.stats{font-size:12px;color:var(--text-dim);padding:14px 24px 0;max-width:1320px;margin:0 auto}

/* GRID */
.grid{max-width:1320px;margin:14px auto 40px;padding:0 24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;transition:border-color .2s,transform .15s}
.card:hover{border-color:rgba(88,166,255,0.3);transform:translateY(-2px)}
.card-preview{width:100%;aspect-ratio:4/3;background:#0a0c12;cursor:grab;position:relative;overflow:hidden}
.card-preview:active{cursor:grabbing}
.card-preview canvas{width:100%!important;height:100%!important;display:block}
.card-body{padding:14px 16px 16px}
.card-name{font-size:15px;font-weight:700;color:var(--text-bright);margin-bottom:6px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px}
.tag{font-size:10px;font-weight:600;padding:3px 8px;border-radius:10px;text-transform:uppercase;letter-spacing:.3px}
.tag-natura{background:rgba(63,185,80,.12);color:#3fb950}
.tag-budynek{background:rgba(210,153,34,.12);color:#d29922}
.tag-dekoracja{background:rgba(188,140,255,.12);color:#bc8cff}
.tag-interaktywny{background:rgba(247,120,186,.12);color:#f778ba}
.tag-pojazd{background:rgba(248,81,73,.12);color:#f85149}
.tag-ruiny{background:rgba(143,168,200,.14);color:#a9bfdc}
.tag-militaria{background:rgba(125,138,60,.18);color:#b7c46a}
.card-desc{font-size:12px;color:var(--text-dim);line-height:1.5;margin-bottom:12px}
.card-meta{display:flex;gap:8px;align-items:center;font-size:11px;color:var(--text-dim);margin-bottom:12px}
.meta-parts{display:flex;align-items:center;gap:3px}
.card-actions{display:flex;gap:8px}
.btn-copy{flex:1;padding:9px 0;background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.25);color:var(--accent);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-copy:hover{background:rgba(88,166,255,.2);border-color:var(--accent)}
.btn-copy.copied{background:rgba(63,185,80,.15);border-color:rgba(63,185,80,.4);color:var(--green)}
.btn-preview{padding:9px 14px;background:rgba(255,255,255,.04);border:1px solid var(--border);color:var(--text-dim);border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .15s}
.btn-preview:hover{background:rgba(255,255,255,.08);color:var(--text)}

/* EMPTY STATE */
.empty{text-align:center;padding:60px 24px;color:var(--text-dim);font-size:14px}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--green);color:#000;padding:10px 24px;border-radius:10px;font-size:13px;font-weight:600;z-index:100;opacity:0;transition:all .3s;pointer-events:none;font-family:inherit}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* JSON MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal-bg.show{display:flex}
.modal{background:var(--card);border:1px solid var(--border);border-radius:14px;width:90%;max-width:600px;max-height:80vh;display:flex;flex-direction:column}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:15px;font-weight:700;color:var(--text-bright)}
.modal-close{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:0 4px}
.modal-close:hover{color:var(--text-bright)}
.modal-body{padding:16px 20px;overflow-y:auto;flex:1}
.modal-body pre{background:#0a0c12;border:1px solid var(--border);border-radius:8px;padding:14px;font-size:12px;line-height:1.6;color:#9ecbff;overflow-x:auto;font-family:'Cascadia Code','Fira Code',monospace;white-space:pre-wrap;word-break:break-all}
.modal-foot{padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end}
.modal-foot .btn-copy{flex:none;padding:9px 20px}

@media(max-width:640px){
  .header h1{font-size:22px}
  .grid{grid-template-columns:1fr}
  .toolbar{flex-direction:column}
  .filter-pills{width:100%;overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .filter-pills::-webkit-scrollbar{display:none}
}
</style>
</head>

</div>
<div class="stats" id="stats"></div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">Brak wyników dla wybranego filtra.</div>

<div class="modal-bg" id="modal">

</div>

// ==================== 3D PREVIEW ENGINE ====================
var previews = [];

function buildPreviewMesh(parts){
  var group = new THREE.Group();
  parts.forEach(function(p){
    if(p.shape === 'pointlight'){
      var li = new THREE.PointLight(new THREE.Color(p.color), p.intensity||1.5, p.distance||12);
      if(p.position) li.position.set(p.position[0], p.position[1], p.position[2]);
      group.add(li);
      var glGeo = new THREE.SphereGeometry(p.size ? p.size[0] : 0.1, 8, 6);
      var glMat = new THREE.MeshBasicMaterial({color: p.color, transparent: true, opacity: 0.85});
      var gl = new THREE.Mesh(glGeo, glMat);
      if(p.position) gl.position.set(p.position[0], p.position[1], p.position[2]);
      group.add(gl);
      return;
    }
    var geo, s = p.size;
    var mat = new THREE.MeshStandardMaterial({color: p.color, roughness: 0.65, metalness: 0.05});
    switch(p.shape){
      case 'box': geo = new THREE.BoxGeometry(s[0],s[1],s[2]); break;
      case 'sphere': geo = new THREE.SphereGeometry(s[0], s[1]||8, s[2]||6); break;
      case 'cylinder': geo = new THREE.CylinderGeometry(s[0],s[1],s[2],s[3]||8); break;
      case 'cone': geo = new THREE.ConeGeometry(s[0],s[1],s[2]||8); break;
      case 'plane': geo = new THREE.PlaneGeometry(s[0],s[1]); break;
      default: geo = new THREE.BoxGeometry(1,1,1);
    }
    var m = new THREE.Mesh(geo, mat);
    if(p.position) m.position.set(p.position[0], p.position[1], p.position[2]);
    if(p.rotation) m.rotation.set(p.rotation[0], p.rotation[1], p.rotation[2]);
    m.castShadow = true;
    m.receiveShadow = true;
    group.add(m);
  });
  return group;
}

// Jeden wspólny renderer WebGL dla wszystkich podglądów.
// Przeglądarka pozwala na ok. 16 kontekstów WebGL naraz — przy 50+ kartach każdy
// z własnym rendererem część podglądów znikała. Teraz rysujemy wszystko jednym
// rendererem i kopiujemy obraz do zwykłego canvasa 2D karty.
var SR = null, dragS = null;
function sharedRenderer(){
  if(!SR){
    SR = new THREE.WebGLRenderer({antialias: true, alpha: false});
    SR.shadowMap.enabled = true;
    SR.setClearColor(0x141942);
  }
  return SR;
}
window.addEventListener('mouseup', function(){ dragS = null; });
window.addEventListener('touchend', function(){ dragS = null; });
function dragMove(x, y){
  if(!dragS) return;
  dragS.rotY += (x - dragS.lastDragX) * 0.01;
  dragS.rotX = Math.max(0.05, Math.min(1.2, dragS.rotX + (y - dragS.lastDragY) * 0.01));
  dragS.lastDragX = x; dragS.lastDragY = y; dragS.needsRender = true;
}
window.addEventListener('mousemove', function(e){ dragMove(e.clientX, e.clientY); });
window.addEventListener('touchmove', function(e){ if(e.touches.length===1) dragMove(e.touches[0].clientX, e.touches[0].clientY); }, {passive:true});
var visObs = ('IntersectionObserver' in window) ? new IntersectionObserver(function(entries){
  entries.forEach(function(en){ var st = en.target._pv; if(st){ st.visible = en.isIntersecting; if(st.visible) st.needsRender = true; } });
}, {rootMargin: '150px'}) : null;

function initPreview(canvas, asset, idx){
  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(40, canvas.width / canvas.height, 0.1, 100);

  scene.add(new THREE.AmbientLight(0x8899bb, 0.5));
  var sun = new THREE.DirectionalLight(0xfff5e0, 0.9);
  sun.position.set(5, 8, 6);
  sun.castShadow = true;
  scene.add(sun);
  scene.add(new THREE.HemisphereLight(0x88bbff, 0x445533, 0.3));

  var ground = new THREE.Mesh(
    new THREE.CircleGeometry(3, 32),
    new THREE.MeshStandardMaterial({color: 0x1f2552, roughness: 0.95})
  );
  ground.rotation.x = -Math.PI/2;
  ground.position.y = -0.01;
  ground.receiveShadow = true;
  scene.add(ground);

  var mesh = buildPreviewMesh(asset.parts);
  scene.add(mesh);

  var box = new THREE.Box3().setFromObject(mesh);
  var center = new THREE.Vector3(); box.getCenter(center);
  var size = new THREE.Vector3(); box.getSize(size);
  var maxDim = Math.max(size.x, size.y, size.z);
  var dist = maxDim * 2.0 + 1.5;

  var state = {
    canvas: canvas, ctx: canvas.getContext('2d'),
    scene: scene, camera: camera, mesh: mesh, center: center, dist: dist,
    rotY: 0.5, rotX: 0.35, autoRotate: true, needsRender: true, visible: !visObs,
    lastDragX: 0, lastDragY: 0
  };
  canvas._pv = state;
  if(visObs) visObs.observe(canvas);

  canvas.addEventListener('mousedown', function(e){ dragS = state; state.autoRotate = false; state.lastDragX = e.clientX; state.lastDragY = e.clientY; });
  canvas.addEventListener('touchstart', function(e){ if(e.touches.length===1){ dragS = state; state.autoRotate = false; state.lastDragX = e.touches[0].clientX; state.lastDragY = e.touches[0].clientY; } }, {passive:true});

  previews.push(state);
  return state;
}
function drawPreview(s){
  var r = sharedRenderer(), c = s.canvas;
  var sz = r.getSize(new THREE.Vector2());
  if(sz.x !== c.width || sz.y !== c.height){ r.setPixelRatio(1); r.setSize(c.width, c.height, false); }
  updateCamera(s);
  r.render(s.scene, s.camera);
  s.ctx.drawImage(r.domElement, 0, 0, c.width, c.height);
}
function disposePreview(s){
  if(visObs) visObs.unobserve(s.canvas);
  s.scene.traverse(function(o){ if(o.geometry) o.geometry.dispose(); if(o.material) o.material.dispose(); });
}

function updateCamera(s){
  s.camera.position.set(
    s.center.x + Math.sin(s.rotY) * Math.cos(s.rotX) * s.dist,
    s.center.y + Math.sin(s.rotX) * s.dist,
    s.center.z + Math.cos(s.rotY) * Math.cos(s.rotX) * s.dist
  );
  s.camera.lookAt(s.center);
}

// ==================== RENDER LOOP ====================
var lastTime = 0;
function animate(now){
  requestAnimationFrame(animate);
  // throttle to ~30fps
  if(now - lastTime < 33) return;
  lastTime = now;
  for(var i = 0; i < previews.length; i++){
    var s = previews[i];
    if(!s.visible) continue;
    if(s.autoRotate){
      s.rotY += 0.008;
      s.needsRender = true;
    }
    if(s.needsRender){
      drawPreview(s);
      s.needsRender = false;
    }
  }
}
requestAnimationFrame(animate);

// ==================== UI ====================
var activeCategory = 'all';
var searchQuery = '';
var visibleCards = [];

function getAssetJSON(asset){
  var obj = {name: asset.name, parts: asset.parts};
  if(asset.action) obj.action = asset.action;
  if(asset.veh) obj.veh = asset.veh;
  return JSON.stringify(obj, null, 2);
}

function showToast(text){
  var t = document.getElementById('toast');
  t.textContent = '✓ ' + text;
  t.classList.add('show');
  clearTimeout(t._tid);
  t._tid = setTimeout(function(){ t.classList.remove('show'); }, 2200);
}

function copyJSON(asset, btn){
  var json = getAssetJSON(asset);
  navigator.clipboard.writeText(json).then(function(){
    btn.textContent = '✓ Skopiowano!';
    btn.classList.add('copied');
    showToast('JSON skopiowany — wklej w edytorze silnika');
    setTimeout(function(){ btn.textContent = '📋 Kopiuj JSON'; btn.classList.remove('copied'); }, 2000);
  }).catch(function(){
    // fallback
    var ta = document.createElement('textarea');
    ta.value = json; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select(); document.execCommand('copy');
    document.body.removeChild(ta);
    btn.textContent = '✓ Skopiowano!';
    btn.classList.add('copied');
    showToast('JSON skopiowany — wklej w edytorze silnika');
    setTimeout(function(){ btn.textContent = '📋 Kopiuj JSON'; btn.classList.remove('copied'); }, 2000);
  });
}

function showModal(asset){
  var json = getAssetJSON(asset);
  document.getElementById('modal-title').textContent = asset.name + ' — JSON';
  document.getElementById('modal-code').textContent = json;
  document.getElementById('modal').classList.add('show');
  document.getElementById('modal-copy').onclick = function(){
    navigator.clipboard.writeText(json).then(function(){
      showToast('JSON skopiowany!');
    });
  };
}

document.getElementById('modal-close').addEventListener('click', function(){
  document.getElementById('modal').classList.remove('show');
});
document.getElementById('modal').addEventListener('click', function(e){
  if(e.target === this) this.classList.remove('show');
});

function renderCards(){
  var grid = document.getElementById('grid');
  // cleanup old previews
  previews.forEach(disposePreview); dragS = null;
  previews = [];
  grid.innerHTML = '';

  var filtered = ASSETS.filter(function(a){
    var catMatch = activeCategory === 'all' || a.category.indexOf(activeCategory) !== -1;
    var searchMatch = !searchQuery || a.name.toLowerCase().indexOf(searchQuery) !== -1 || a.desc.toLowerCase().indexOf(searchQuery) !== -1;
    return catMatch && searchMatch;
  });

  document.getElementById('stats').textContent = filtered.length + ' z ' + ASSETS.length + ' obiektów';
  document.getElementById('empty').style.display = filtered.length === 0 ? 'block' : 'none';

  filtered.forEach(function(asset, idx){
    var card = document.createElement('div');
    card.className = 'card';

    var preview = document.createElement('div');
    preview.className = 'card-preview';
    var canvas = document.createElement('canvas');
    preview.appendChild(canvas);
    card.appendChild(preview);

    var body = document.createElement('div');
    body.className = 'card-body';

    var name = document.createElement('div');
    name.className = 'card-name';
    name.textContent = asset.name;
    body.appendChild(name);

    var tags = document.createElement('div');
    tags.className = 'card-tags';
    asset.category.forEach(function(cat){
      var tag = document.createElement('span');
      tag.className = 'tag tag-' + cat;
      var labels = {natura:'Natura',budynek:'Budynek',dekoracja:'Dekoracja',interaktywny:'Interaktywny',pojazd:'Pojazd',ruiny:'Ruiny',militaria:'Militaria'};
      tag.textContent = labels[cat] || cat;
      tags.appendChild(tag);
    });
    body.appendChild(tags);

    var desc = document.createElement('div');
    desc.className = 'card-desc';
    desc.textContent = asset.desc;
    body.appendChild(desc);

    var meta = document.createElement('div');
    meta.className = 'card-meta';
    meta.innerHTML = '<span class="meta-parts">🧱 ' + asset.parts.length + ' części</span>';
    if(asset.action){
      var aLabels = {text:'💬 Tekst', open:'🚪 Otwieranie', teleport:'🌀 Teleport', sound:'🔊 Dźwięk', light:'💡 Światło', drive:'🚗 Jazda'};
      meta.innerHTML += '<span>' + (aLabels[asset.action.type]||asset.action.type) + '</span>';
    }
    if(asset.veh){var vl={explode:'💥 Wybuch',destroy:'🧱 Rozpada się',knock:'↗ Odlatuje',shake:'〰 Wstrząs'};var shown=['explode','destroy','knock','shake'].filter(function(k){return asset.veh[k];})[0];if(shown)meta.innerHTML+='<span>'+vl[shown]+'</span>';}
    body.appendChild(meta);

    var actions = document.createElement('div');
    actions.className = 'card-actions';
    var btnCopy = document.createElement('button');
    btnCopy.className = 'btn-copy';
    btnCopy.textContent = '📋 Kopiuj JSON';
    (function(a, b){ btnCopy.addEventListener('click', function(){ copyJSON(a, b); }); })(asset, btnCopy);
    actions.appendChild(btnCopy);

    var btnView = document.createElement('button');
    btnView.className = 'btn-preview';
    btnView.textContent = '{ }';
    btnView.title = 'Podgląd JSON';
    (function(a){ btnView.addEventListener('click', function(){ showModal(a); }); })(asset);
    actions.appendChild(btnView);

    body.appendChild(actions);
    card.appendChild(body);
    grid.appendChild(card);

    // init 3D after DOM attach
    requestAnimationFrame(function(){
      var w = canvas.parentElement.clientWidth;
      var h = canvas.parentElement.clientHeight;
      canvas.width = w * Math.min(devicePixelRatio, 2);
      canvas.height = h * Math.min(devicePixelRatio, 2);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      initPreview(canvas, asset, idx);
    });
  });
}

// FILTERS
document.getElementById('filters').addEventListener('click', function(e){
  var pill = e.target.closest('.pill');
  if(!pill) return;
  document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('active'); });
  pill.classList.add('active');
  activeCategory = pill.dataset.cat;
  renderCards();
});

// SEARCH
var searchTimer;
document.getElementById('search').addEventListener('input', function(e){
  clearTimeout(searchTimer);
  searchTimer = setTimeout(function(){
    searchQuery = e.target.value.trim().toLowerCase();
    renderCards();
  }, 200);
});

// RESIZE
var resizeTimer;
window.addEventListener('resize', function(){
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(function(){
    previews.forEach(function(s){
      var c = s.renderer.domElement;
      var p = c.parentElement;
      if(!p) return;
      var w = p.clientWidth;
      var h = p.clientHeight;
      c.width = w * Math.min(devicePixelRatio, 2);
      c.height = h * Math.min(devicePixelRatio, 2);
      s.renderer.setSize(w, h);
      s.camera.aspect = w / h;
      s.camera.updateProjectionMatrix();
      s.needsRender = true;
    });
  }, 150);
});

// INIT
renderCards();

})();
</script>
